name: Release APK

# Builds the catalog app and attaches the APK to a GitHub release.
# Run it from the Actions tab ("Run workflow") or push a tag like v0.1.0-alpha.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (created if it does not exist)
        default: v0.1.0-alpha
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Set up the release key (when the secrets exist)
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
              echo "RELEASE_KEYSTORE_PASSWORD=$STORE_PASSWORD"
              echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
              echo "RELEASE_KEY_PASSWORD=${KEY_PASSWORD:-$STORE_PASSWORD}"
            } >> "$GITHUB_ENV"
            echo "Signing with the release key."
          else
            echo "No release key set up, signing with the debug key."
          fi
      - name: Build the optimized release APK
        run: bash ./gradlew --no-daemon :catalog:assembleRelease
      - name: Name the APK
        run: cp catalog/build/outputs/apk/release/catalog-release.apk Iris-Catalog.apk
      - name: Release notes
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          FILE=".github/release-notes/$TAG.md"
          if [ -f "$FILE" ]; then
            cp "$FILE" "$RUNNER_TEMP/notes.md"
          else
            printf '%s\n' 'Catalog app of the Iris UI kit (alpha). Download `Iris-Catalog.apk` below and install it on an Android phone (Android 8+, blur needs Android 12+). Allow installs from this source when asked.' > "$RUNNER_TEMP/notes.md"
          fi
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ColorOS UI Catalog ${{ github.event.inputs.tag || github.ref_name }} (alpha)
          prerelease: false
          make_latest: true
          files: Iris-Catalog.apk
          body_path: ${{ runner.temp }}/notes.md
      - name: Remove other APKs from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' | while read -r name; do
            case "$name" in
              Iris-Catalog.apk) ;;
              *.apk) gh release delete-asset "$TAG" "$name" --repo "${{ github.repository }}" --yes ;;
            esac
          done
