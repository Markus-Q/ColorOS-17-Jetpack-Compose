name: Release APK

# Builds the catalog app and attaches the APK to a GitHub release.
# Run it from the Actions tab ("Run workflow") or push a tag like v0.1.0-alpha.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (created if it does not exist)
        default: v0.1.0-alpha
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build debug APK
        run: bash ./gradlew --no-daemon :catalog:assembleDebug
      - name: Name the APK
        run: cp catalog/build/outputs/apk/debug/catalog-debug.apk Iris-Catalog.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ColorOS UI Catalog ${{ github.event.inputs.tag || github.ref_name }} (alpha)
          prerelease: true
          files: Iris-Catalog.apk
          body: |
            Catalog app of the Iris UI kit (alpha). Download `Iris-Catalog.apk` below and install it on an Android phone
            (Android 8+, blur needs Android 12+). Allow installs from this source when asked.
            The APK is signed with the debug key.
