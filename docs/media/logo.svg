<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1B1D24"/><stop offset="1" stop-color="#07080B"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#1A8CFF" stop-opacity="0.5"/><stop offset="1" stop-color="#1A8CFF" stop-opacity="0"/></radialGradient>
    <linearGradient id="ringFill" x1="0.15" y1="0" x2="0.85" y2="1"><stop offset="0" stop-color="#6CC0FF"/><stop offset="0.55" stop-color="#1A8CFF"/><stop offset="1" stop-color="#0B4FD6"/></linearGradient>
    <!-- edge light of the outer ring edge: brightest at the very edge, fades inward -->
    <radialGradient id="outerEdge" cx="0.5" cy="0.5" r="0.5"><stop offset="0.8" stop-color="#fff" stop-opacity="0"/><stop offset="0.93" stop-color="#fff" stop-opacity="0.22"/><stop offset="0.985" stop-color="#fff" stop-opacity="0.6"/><stop offset="1" stop-color="#fff" stop-opacity="1"/></radialGradient>
    <!-- edge light of the inner edge: starts at the hole edge and fades out into the ring -->
    <radialGradient id="innerEdge" cx="0.5" cy="0.5" r="0.5"><stop offset="0.826" stop-color="#fff" stop-opacity="0.95"/><stop offset="0.87" stop-color="#fff" stop-opacity="0.45"/><stop offset="0.95" stop-color="#fff" stop-opacity="0.1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="gTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0.2" stop-color="#fff"/><stop offset="0.5" stop-color="#000"/></linearGradient>
    <linearGradient id="gBot" x1="0" y1="0" x2="0" y2="1"><stop offset="0.5" stop-color="#000"/><stop offset="0.8" stop-color="#fff"/></linearGradient>
    <mask id="mTop" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><rect width="1024" height="1024" fill="url(#gTop)"/></mask>
    <mask id="mBot" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><rect width="1024" height="1024" fill="url(#gBot)"/></mask>
    <filter id="b30" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="b4" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
    <clipPath id="tileClip"><rect width="1024" height="1024" rx="230"/></clipPath>
    <clipPath id="ring"><path clip-rule="evenodd" d="M230 512 A282 282 0 1 0 794 512 A282 282 0 1 0 230 512 Z M322 512 A190 190 0 1 1 702 512 A190 190 0 1 1 322 512 Z"/></clipPath>
  </defs>
  <g clip-path="url(#tileClip)">
    <rect width="1024" height="1024" fill="url(#tile)"/>
    <circle cx="512" cy="512" r="400" fill="url(#glow)"/>
  </g>
  <!-- soft blue light behind the glass ring -->
  <circle cx="512" cy="512" r="236" fill="none" stroke="#1A8CFF" stroke-width="100" opacity="0.5" filter="url(#b30)"/>
  <!-- the glass ring -->
  <g clip-path="url(#ring)">
    <circle cx="512" cy="512" r="282" fill="url(#ringFill)" opacity="0.82"/>
    <circle cx="512" cy="512" r="282" fill="url(#outerEdge)" mask="url(#mTop)"/>
    <circle cx="512" cy="512" r="230" fill="url(#innerEdge)" mask="url(#mBot)"/>
  </g>
  <!-- the dot as a small glass bead -->
  <circle cx="512" cy="520" r="70" fill="#04122E" opacity="0.3" filter="url(#b4)"/>
  <circle cx="512" cy="512" r="70" fill="#EEF3FA"/>
</svg>
