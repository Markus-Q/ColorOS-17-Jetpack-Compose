<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2A2470"/><stop offset="0.55" stop-color="#17143F"/><stop offset="1" stop-color="#0C0B26"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A060D8"/><stop offset="1" stop-color="#5A32A8"/></linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF8A3D"/><stop offset="0.6" stop-color="#F0603A"/><stop offset="1" stop-color="#C0406A"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="frost" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="55"/></filter>
    <filter id="b4" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="b18" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="b40" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <g id="wall">
      <rect x="-200" y="-200" width="1424" height="1424" fill="url(#navy)"/>
      <path d="M1224 -200 V540 C 920 540 750 430 690 262 C 655 165 625 40 585 -200 Z" fill="url(#purple)" filter="url(#soft)"/>
      <path d="M-200 1224 V650 C 150 560 360 670 560 800 C 700 890 860 910 1224 880 V1224 Z" fill="url(#coral)" filter="url(#soft)"/>
      <path d="M-200 -200 H400 C 320 150 150 250 -200 260 Z" fill="#5B3FC4" opacity="0.65" filter="url(#soft)"/>
    </g>
    <linearGradient id="lift" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.04"/><stop offset="1" stop-color="#fff" stop-opacity="0.34"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.95"/><stop offset="0.16" stop-color="#fff" stop-opacity="0.12"/><stop offset="0.3" stop-color="#fff" stop-opacity="0"/><stop offset="0.7" stop-color="#fff" stop-opacity="0"/><stop offset="0.84" stop-color="#FFE2C4" stop-opacity="0.14"/><stop offset="1" stop-color="#FFE2C4" stop-opacity="0.95"/></linearGradient>
    
    <radialGradient id="edgeW" cx="0.5" cy="0.5" r="0.5"><stop offset="0.9" stop-color="#fff" stop-opacity="0"/><stop offset="0.95" stop-color="#fff" stop-opacity="0.16"/><stop offset="0.985" stop-color="#fff" stop-opacity="0.55"/><stop offset="1" stop-color="#fff" stop-opacity="1"/></radialGradient>
    <radialGradient id="edgeO" cx="0.5" cy="0.5" r="0.5"><stop offset="0.9" stop-color="#FFD6B0" stop-opacity="0"/><stop offset="0.95" stop-color="#FFD6B0" stop-opacity="0.2"/><stop offset="0.985" stop-color="#FFE3C8" stop-opacity="0.65"/><stop offset="1" stop-color="#FFF0E0" stop-opacity="1"/></radialGradient>
    <linearGradient id="gTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="0.3" stop-color="#fff" stop-opacity="0.35"/><stop offset="0.48" stop-color="#000"/></linearGradient>
    <linearGradient id="gBot" x1="0" y1="0" x2="0" y2="1"><stop offset="0.52" stop-color="#000"/><stop offset="0.7" stop-color="#fff" stop-opacity="0.45"/><stop offset="1" stop-color="#fff"/></linearGradient>
    <mask id="mTop" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><rect width="1024" height="1024" fill="url(#gTop)"/></mask>
    <mask id="mBot" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><rect width="1024" height="1024" fill="url(#gBot)"/></mask>
    <clipPath id="disc"><circle cx="512" cy="512" r="484"/></clipPath>
  </defs>
    <!-- shadow under the glass -->
  <!-- frosted backdrop -->
  <g clip-path="url(#disc)"><g style="isolation:isolate">
    <use href="#wall" filter="url(#frost)"/>
    <rect x="-200" y="-200" width="1424" height="1424" fill="#505050" fill-opacity="0.651" style="mix-blend-mode:luminosity"/>
    <rect x="-200" y="-200" width="1424" height="1424" fill="#A7A7A7" fill-opacity="0.298" style="mix-blend-mode:overlay"/>
  </g></g>
  <g clip-path="url(#disc)">
    <circle cx="512" cy="512" r="484" fill="url(#edgeW)" mask="url(#mTop)" opacity="0.9"/>
    <circle cx="512" cy="512" r="484" fill="url(#edgeO)" mask="url(#mBot)"/>
  </g>
  <!-- M -->
  <g opacity="0.3" transform="translate(0 12)" filter="url(#b4)"><path d="M512 352 V672 M352 512 H672" stroke="#0A0820" stroke-width="70" stroke-linecap="round" fill="none"/></g><path d="M512 352 V672 M352 512 H672" stroke="#fff" stroke-width="70" stroke-linecap="round" fill="none"/></svg>